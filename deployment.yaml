apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-backend-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-backend-app
  template:
    metadata:
      labels:
        app: java-backend-app
    spec:
      containers:
      - name: java-backend-app
        image: poojabusa/java-backend-app:1.0
        ports:
        - containerPort: 8080
